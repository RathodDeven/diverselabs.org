<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Distributor price-list extraction pipeline">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0c0e"/>
      <stop offset="1" stop-color="#070708"/>
    </linearGradient>
    <radialGradient id="glow2" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#7a90ff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#7a90ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg2)"/>
  <rect width="800" height="500" fill="url(#glow2)"/>
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 125H800M0 250H800M0 375H800"/>
    <path d="M200 0V500M400 0V500M600 0V500"/>
  </g>
  <!-- PDF doc -->
  <g transform="translate(70,150)">
    <rect width="200" height="250" rx="12" fill="#101013" stroke="#ffffff" stroke-opacity="0.12"/>
    <path d="M150 0 H200 V50 Z" fill="#ffffff" fill-opacity="0.06"/>
    <text x="24" y="44" font-family="'JetBrains Mono', monospace" font-size="12" fill="#ffffff" fill-opacity="0.4" letter-spacing="1">PRICE LIST.pdf</text>
    <g fill="#ffffff" fill-opacity="0.08">
      <rect x="24" y="72" width="150" height="9" rx="4.5"/>
      <rect x="24" y="92" width="120" height="9" rx="4.5"/>
      <rect x="24" y="112" width="140" height="9" rx="4.5"/>
      <rect x="24" y="132" width="100" height="9" rx="4.5"/>
      <rect x="24" y="152" width="150" height="9" rx="4.5"/>
      <rect x="24" y="172" width="116" height="9" rx="4.5"/>
      <rect x="24" y="192" width="134" height="9" rx="4.5"/>
      <rect x="24" y="212" width="92" height="9" rx="4.5"/>
    </g>
  </g>
  <!-- arrow -->
  <g transform="translate(300,275)">
    <path d="M0 0 H80" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>
    <path d="M72 -6 L84 0 L72 6" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="40" y="-16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ffffff" fill-opacity="0.4" letter-spacing="1">AI</text>
  </g>
  <!-- table -->
  <g transform="translate(420,150)">
    <rect width="310" height="250" rx="12" fill="#101013" stroke="#ffffff" stroke-opacity="0.18"/>
    <g font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="0.5">
      <rect x="0" y="0" width="310" height="40" rx="12" fill="#ffffff" fill-opacity="0.05"/>
      <text x="20" y="25" fill="#ffffff" fill-opacity="0.5">SKU</text>
      <text x="120" y="25" fill="#ffffff" fill-opacity="0.5">ITEM</text>
      <text x="250" y="25" fill="#ffffff" fill-opacity="0.5">PRICE</text>
    </g>
    <g stroke="#ffffff" stroke-opacity="0.08">
      <path d="M0 80H310M0 120H310M0 160H310M0 200H310"/>
      <path d="M100 40V250M230 40V250"/>
    </g>
    <g fill="#ffffff" fill-opacity="0.5" font-family="'JetBrains Mono', monospace" font-size="11">
      <text x="20" y="65">A-1024</text><text x="120" y="65" fill-opacity="0.35">valve</text><text x="250" y="65">$42</text>
      <text x="20" y="105">A-1101</text><text x="120" y="105" fill-opacity="0.35">flange</text><text x="250" y="105">$18</text>
      <text x="20" y="145">B-2207</text><text x="120" y="145" fill-opacity="0.35">gasket</text><text x="250" y="145">$7</text>
      <text x="20" y="185">B-2310</text><text x="120" y="185" fill-opacity="0.35">coupler</text><text x="250" y="185">$31</text>
    </g>
  </g>
  <text x="70" y="452" font-family="'Space Grotesk', sans-serif" font-size="26" font-weight="600" fill="#ffffff" letter-spacing="-0.5">Distributor catalog pipeline</text>
</svg>
