<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Zoho CRM AI follow-up agent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0c0e"/>
      <stop offset="1" stop-color="#070708"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#7a90ff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#7a90ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 125H800M0 250H800M0 375H800"/>
    <path d="M200 0V500M400 0V500M600 0V500"/>
  </g>
  <!-- flow dots -->
  <g font-family="'JetBrains Mono', monospace" font-size="13" fill="#ffffff" fill-opacity="0.45" letter-spacing="1.5">
    <text x="60" y="70">ZOHO</text>
    <text x="60" y="92" font-size="11" fill-opacity="0.3">webhook</text>
    <text x="340" y="70" text-anchor="middle">CONTEXT + RESEARCH</text>
    <text x="700" y="70" text-anchor="end">DRAFT</text>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.25" stroke-dasharray="3 5">
    <path d="M130 82H300"/>
    <path d="M430 82H660"/>
  </g>
  <!-- approval card -->
  <rect x="60" y="150" width="680" height="250" rx="18" fill="#101013" stroke="#ffffff" stroke-opacity="0.12"/>
  <g transform="translate(92,182)">
    <circle cx="6" cy="6" r="5" fill="#ffffff" fill-opacity="0.14"/>
    <circle cx="24" cy="6" r="5" fill="#ffffff" fill-opacity="0.14"/>
    <circle cx="42" cy="6" r="5" fill="#ffffff" fill-opacity="0.14"/>
    <text x="70" y="11" font-family="'JetBrains Mono', monospace" font-size="12" fill="#ffffff" fill-opacity="0.4" letter-spacing="1.5">FOLLOW-UP DRAFT</text>
  </g>
  <g transform="translate(92,228)">
    <rect width="430" height="13" rx="6.5" fill="#ffffff" fill-opacity="0.14"/>
    <rect y="30" width="560" height="11" rx="5.5" fill="#ffffff" fill-opacity="0.07"/>
    <rect y="56" width="520" height="11" rx="5.5" fill="#ffffff" fill-opacity="0.07"/>
    <rect y="82" width="360" height="11" rx="5.5" fill="#ffffff" fill-opacity="0.07"/>
  </g>
  <g transform="translate(92,346)">
    <rect width="150" height="34" rx="17" fill="#ffffff"/>
    <text x="75" y="22" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#0a0a0a">Approve &amp; send</text>
    <rect x="166" width="110" height="34" rx="17" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="221" y="22" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" fill="#ffffff" fill-opacity="0.7">Edit</text>
  </g>
  <text x="640" y="372" font-family="'JetBrains Mono', monospace" font-size="12" fill="#7fe0a0" fill-opacity="0.7" letter-spacing="1">HUMAN-IN-LOOP</text>
  <text x="60" y="452" font-family="'Space Grotesk', sans-serif" font-size="26" font-weight="600" fill="#ffffff" letter-spacing="-0.5">Zoho CRM follow-up agent</text>
</svg>
