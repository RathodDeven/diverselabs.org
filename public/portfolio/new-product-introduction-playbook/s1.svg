<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Architecture map of a seven-chapter supply-chain NPI playbook. Introduction and References act as bookends with core chapters Stakeholders, Readiness Timelines and Scenarios in the middle, and a continuous-improvement feedback loop running from Scenarios back up to the Readiness Timelines chapter.">
