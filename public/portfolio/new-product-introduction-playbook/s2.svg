<svg viewBox="0 0 640 400" role="img" aria-label="Stage-gate timeline for a new-product-introduction playbook, counting backward from launch with stage-appropriate checklists and a branch into a compressed scenario path" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono',monospace">
