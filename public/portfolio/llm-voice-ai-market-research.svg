<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Market-size bars across sectors with a growth arc">
  <defs>
    <pattern id="g11" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.05"/></pattern>
    <radialGradient id="v11" cx="50%" cy="40%" r="66%"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="640" height="400" fill="#0a0a0a"/><rect width="640" height="400" fill="url(#g11)"/><rect width="640" height="400" fill="url(#v11)"/>
  <path d="M96 310 H552" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
  <!-- current vs projected bars per sector -->
  <g>
    <rect x="120" y="250" width="26" height="60" rx="3" fill="#ffffff" fill-opacity="0.30"/><rect x="150" y="200" width="26" height="110" rx="3" fill="#ffffff" fill-opacity="0.8"/>
    <rect x="216" y="262" width="26" height="48" rx="3" fill="#ffffff" fill-opacity="0.30"/><rect x="246" y="180" width="26" height="130" rx="3" fill="#ffffff" fill-opacity="0.8"/>
    <rect x="312" y="240" width="26" height="70" rx="3" fill="#ffffff" fill-opacity="0.30"/><rect x="342" y="150" width="26" height="160" rx="3" fill="#ffffff" fill-opacity="0.8"/>
    <rect x="408" y="270" width="26" height="40" rx="3" fill="#ffffff" fill-opacity="0.30"/><rect x="438" y="214" width="26" height="96" rx="3" fill="#ffffff" fill-opacity="0.8"/>
    <rect x="504" y="256" width="26" height="54" rx="3" fill="#ffffff" fill-opacity="0.30"/><rect x="534" y="170" width="18" height="140" rx="3" fill="#ffffff" fill-opacity="0.8"/>
  </g>
  <!-- growth arc -->
  <path d="M133 240 C 260 120, 400 110, 543 140" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="5 7" fill="none" stroke-linecap="round"/>
  <g fill="#ffffff" fill-opacity="0.4" font-family="'JetBrains Mono',monospace" font-size="11" text-anchor="middle">
    <text x="146" y="332">EDU</text><text x="242" y="332">LEGAL</text><text x="338" y="332">DEF</text><text x="434" y="332">AGRI</text><text x="528" y="332">VOICE</text>
  </g>
</svg>
