<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pricing and trade dashboard: combined bar and line chart with filters">
  <defs><pattern id="co2" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity="0.05"/></pattern>
  <radialGradient id="co2v" cx="50%" cy="40%" r="66%"><stop offset="0%" stop-color="#fff" stop-opacity="0.06"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
  <rect width="640" height="400" fill="#0a0a0a"/><rect width="640" height="400" fill="url(#co2)"/><rect width="640" height="400" fill="url(#co2v)"/>
  <text x="60" y="50" font-family="'JetBrains Mono',monospace" font-size="10" fill="#fff" fill-opacity="0.5">PRICING &amp; TRADE DASHBOARD</text>
