    <rect x="60" y="64" width="70" height="20" rx="10" fill="#fff" fill-opacity="0.08" stroke="#fff" stroke-opacity="0.3"/>
    <rect x="140" y="64" width="70" height="20" rx="10" fill="#fff" fill-opacity="0.08" stroke="#fff" stroke-opacity="0.3"/>
    <rect x="220" y="64" width="70" height="20" rx="10" fill="#fff" fill-opacity="0.14" stroke="#fff" stroke-opacity="0.6"/>
  </g>
  <g font-family="'JetBrains Mono',monospace" font-size="7.5" fill="#fff" fill-opacity="0.5" text-anchor="middle"><text x="95" y="78">REGION</text><text x="175" y="78">YEAR</text><text x="255" y="78">SKU</text></g>
  <!-- combo chart -->
  <path d="M80 320 H580 M80 320 V104" stroke="#fff" stroke-opacity="0.45" stroke-width="2" fill="none" stroke-linecap="round"/>
  <g stroke="#fff" stroke-opacity="0.08" stroke-width="1"><path d="M80 260 H580"/><path d="M80 200 H580"/><path d="M80 150 H580"/></g>
  <g fill="#fff" fill-opacity="0.28">
    <rect x="104" y="240" width="34" height="80" rx="3"/><rect x="168" y="220" width="34" height="100" rx="3"/><rect x="232" y="232" width="34" height="88" rx="3"/><rect x="296" y="196" width="34" height="124" rx="3"/><rect x="360" y="210" width="34" height="110" rx="3"/><rect x="424" y="176" width="34" height="144" rx="3"/><rect x="488" y="188" width="34" height="132" rx="3"/>
  </g>
  <path d="M121 232 L 185 210 L 249 222 L 313 182 L 377 196 L 441 160 L 505 172" stroke="#fff" stroke-opacity="0.92" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#fff"><circle cx="121" cy="232" r="3.5"/><circle cx="185" cy="210" r="3.5"/><circle cx="249" cy="222" r="3.5"/><circle cx="313" cy="182" r="3.5"/><circle cx="377" cy="196" r="3.5"/><circle cx="441" cy="160" r="3.5"/><circle cx="505" cy="172" r="3.5"/></g>
  <g font-family="'JetBrains Mono',monospace" font-size="8" fill="#fff" fill-opacity="0.5">
    <rect x="80" y="338" width="12" height="9" rx="2" fill="#fff" fill-opacity="0.28"/><text x="98" y="346">volume</text>
    <line x1="176" y1="342" x2="196" y2="342" stroke="#fff" stroke-opacity="0.9" stroke-width="2"/><text x="202" y="346">avg price</text>
