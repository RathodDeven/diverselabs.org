<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A four-stage manufacturing network of linked nodes">
  <defs>
    <pattern id="g4" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.05"/></pattern>
    <radialGradient id="v4" cx="50%" cy="42%" r="65%"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="640" height="400" fill="#0a0a0a"/><rect width="640" height="400" fill="url(#g4)"/><rect width="640" height="400" fill="url(#v4)"/>
  <!-- links -->
  <g stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" fill="none">
    <path d="M150 200 H250"/><path d="M310 200 H410"/><path d="M470 200 H548"/>
    <path d="M280 175 C 330 120, 360 120, 410 175"/>
    <path d="M280 225 C 330 280, 360 280, 410 225"/>
  </g>
  <!-- secondary supplier nodes -->
  <g fill="#0a0a0a" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2">
    <circle cx="345" cy="112" r="16"/><circle cx="345" cy="288" r="16"/>
  </g>
  <!-- main stage nodes -->
  <g>
    <circle cx="120" cy="200" r="30" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2.5"/>
    <circle cx="280" cy="200" r="30" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2.5"/>
    <circle cx="440" cy="200" r="30" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2.5"/>
    <circle cx="560" cy="200" r="22" fill="#ffffff" fill-opacity="0.22" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2.5"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.6" font-family="'JetBrains Mono',monospace" font-size="12" text-anchor="middle">
    <text x="120" y="255">API</text><text x="280" y="255">DP</text><text x="440" y="255">PACK</text><text x="560" y="245">DIST</text>
  </g>
</svg>
