    <rect x="194" y="94" width="144" height="30" rx="6" stroke-dasharray="4 3"/>
    <rect x="350" y="94" width="144" height="30" rx="6" stroke-dasharray="4 3"/>
    <rect x="506" y="94" width="108" height="30" rx="6" stroke-dasharray="4 3"/>
    
    <path d="M184 109 H194 M334 109 H350 M490 109 H506"/>
