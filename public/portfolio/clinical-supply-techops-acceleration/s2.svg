      <text x="240" y="266" fill-opacity="0.5">C</text><text x="312" y="266" fill-opacity="0.6">A</text><text x="384" y="266" fill-opacity="0.55">R</text><text x="456" y="266" fill-opacity="0.4">I</text><text x="528" y="266" fill-opacity="0.45">C</text>
      
      <text x="240" y="282" fill-opacity="0.4">I</text><text x="312" y="282" fill-opacity="0.55">R</text><text x="384" y="282" fill-opacity="0.6">A</text><text x="456" y="282" fill-opacity="0.45">C</text><text x="528" y="282" fill-opacity="0.4">I</text>
      
      <text x="240" y="298" fill-opacity="0.45">C</text><text x="312" y="298" fill-opacity="0.4">I</text><text x="384" y="298" fill-opacity="0.6">A</text><text x="456" y="298" fill-opacity="0.55">R</text><text x="528" y="298" fill-opacity="0.4">I</text>
      
      <text x="240" y="314" fill-opacity="0.4">I</text><text x="312" y="314" fill-opacity="0.45">C</text><text x="384" y="314" fill-opacity="0.55">R</text><text x="456" y="314" fill-opacity="0.6">A</text><text x="528" y="314" fill-opacity="0.4">I</text>
      
      <text x="240" y="330" fill-opacity="0.4">I</text><text x="312" y="330" fill-opacity="0.4">I</text><text x="384" y="330" fill-opacity="0.45">C</text><text x="456" y="330" fill-opacity="0.6">A</text><text x="528" y="330" fill-opacity="0.55">R</text>
      
      <text x="240" y="346" fill-opacity="0.45">C</text><text x="312" y="346" fill-opacity="0.4">I</text><text x="384" y="346" fill-opacity="0.4">I</text><text x="456" y="346" fill-opacity="0.55">R</text><text x="528" y="346" fill-opacity="0.6">A</text>
      
      <text x="240" y="362" fill-opacity="0.6">A</text><text x="312" y="362" fill-opacity="0.4">I</text><text x="384" y="362" fill-opacity="0.4">I</text><text x="456" y="362" fill-opacity="0.45">C</text><text x="528" y="362" fill-opacity="0.55">R</text>
