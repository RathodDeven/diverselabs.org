<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Critical-path map with a RACI responsibility grid">
  <defs><pattern id="cs2" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity="0.05"/></pattern>
  <radialGradient id="cs2v" cx="50%" cy="38%" r="66%"><stop offset="0%" stop-color="#fff" stop-opacity="0.06"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
  <rect width="640" height="400" fill="#0a0a0a"/><rect width="640" height="400" fill="url(#cs2)"/><rect width="640" height="400" fill="url(#cs2v)"/>
  <text x="40" y="70" font-family="'JetBrains Mono',monospace" font-size="10" fill="#fff" fill-opacity="0.5">CRITICAL PATH</text>
  <!-- critical path nodes -->
  <path d="M70 130 H560" stroke="#fff" stroke-opacity="0.85" stroke-width="2.5"/>
  <g fill="#fff"><circle cx="70" cy="130" r="7"/><circle cx="192" cy="130" r="7"/><circle cx="314" cy="130" r="7"/><circle cx="436" cy="130" r="7"/><circle cx="560" cy="130" r="7"/></g>
  <!-- off-path (slack) branches -->
  <g stroke="#fff" stroke-opacity="0.3" stroke-width="1.5" fill="none"><path d="M192 130 C 240 90, 280 90, 314 130"/><path d="M314 130 C 360 170, 400 170, 436 130"/></g>
  <g fill="#fff" fill-opacity="0.4"><circle cx="253" cy="92" r="4"/><circle cx="375" cy="168" r="4"/></g>
  <g font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#fff" fill-opacity="0.5" text-anchor="middle">
    <text x="70" y="156">DS</text><text x="192" y="156">DP</text><text x="314" y="156">QC</text><text x="436" y="156">REL</text><text x="560" y="156">SITE</text>
  </g>
  <!-- RACI grid -->
  <text x="40" y="222" font-family="'JetBrains Mono',monospace" font-size="10" fill="#fff" fill-opacity="0.5">RACI</text>
  <g font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#fff" fill-opacity="0.45" text-anchor="middle">
    <text x="300" y="244">TECHOPS</text><text x="372" y="244">QUALITY</text><text x="444" y="244">CLINOPS</text><text x="516" y="244">SUPPLY</text>
  </g>
  <g font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#fff" fill-opacity="0.5">
    <text x="40" y="272">PLAN</text><text x="40" y="300">MAKE</text><text x="40" y="328">SHIP</text>
  </g>
  <!-- cells with R/A/C/I letters -->
  <g font-family="'JetBrains Mono',monospace" font-size="10" text-anchor="middle">
    <g><rect x="270" y="256" width="60" height="22" rx="3" fill="#fff" fill-opacity="0.28"/><text x="300" y="271" fill="#0a0a0a">A</text></g>
    <g><rect x="342" y="256" width="60" height="22" rx="3" fill="#fff" fill-opacity="0.12"/><text x="372" y="271" fill="#fff" fill-opacity="0.7">C</text></g>
    <g><rect x="414" y="256" width="60" height="22" rx="3" fill="#fff" fill-opacity="0.12"/><text x="444" y="271" fill="#fff" fill-opacity="0.7">R</text></g>
    <g><rect x="486" y="256" width="60" height="22" rx="3" fill="#fff" fill-opacity="0.08"/><text x="516" y="271" fill="#fff" fill-opacity="0.5">I</text></g>
    <g><rect x="270" y="284" width="60" height="22" rx="3" fill="#fff" fill-opacity="0.28"/><text x="300" y="299" fill="#0a0a0a">R</text></g>
    <g><rect x="342" y="284" width="60" height="22" rx="3" fill="#fff" fill-opacity="0.28"/><text x="372" y="299" fill="#0a0a0a">A</text></g>
    <g><rect x="414" y="284" width="60" height="22" rx="3" fill="#fff" fill-opacity="0.08"/><text x="444" y="299" fill="#fff" fill-opacity="0.5">I</text></g>
    <g><rect x="486" y="284" width="60" height="22" rx="3" fill="#fff" fill-opacity="0.12"/><text x="516" y="299" fill="#fff" fill-opacity="0.7">C</text></g>
    <g><rect x="270" y="312" width="60" height="22" rx="3" fill="#fff" fill-opacity="0.12"/><text x="300" y="327" fill="#fff" fill-opacity="0.7">C</text></g>
    <g><rect x="342" y="312" width="60" height="22" rx="3" fill="#fff" fill-opacity="0.08"/><text x="372" y="327" fill="#fff" fill-opacity="0.5">I</text></g>
    <g><rect x="414" y="312" width="60" height="22" rx="3" fill="#fff" fill-opacity="0.28"/><text x="444" y="327" fill="#0a0a0a">A</text></g>
    <g><rect x="486" y="312" width="60" height="22" rx="3" fill="#fff" fill-opacity="0.28"/><text x="516" y="327" fill="#0a0a0a">R</text></g>
  </g>
</svg>
