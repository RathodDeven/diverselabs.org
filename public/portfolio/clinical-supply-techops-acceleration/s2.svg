<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Critical-path map and RACI: four-phase swimlane of activity cards with the critical path highlighted across phases, and an activity-by-function RACI matrix">
  <defs>
    <pattern id="g" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity="0.05"/></pattern>
    <radialGradient id="gv" cx="50%" cy="38%" r="66%"><stop offset="0%" stop-color="#fff" stop-opacity="0.06"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="640" height="400" fill="#0a0a0a"/>
  <rect width="640" height="400" fill="url(#g)"/>
  <rect width="640" height="400" fill="url(#gv)"/>

  <text x="32" y="34" font-family="'JetBrains Mono',monospace" font-size="10" fill="#fff" fill-opacity="0.5">CRITICAL-PATH MAP · RACI</text>
  <text x="608" y="34" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.32">02 / 03</text>

  <g font-family="'JetBrains Mono',monospace">
    
    <path d="M32 56 H172 L186 70 L172 84 H32 Z" fill="#fff" fill-opacity="0.08" stroke="#fff" stroke-opacity="0.18" stroke-width="1"/>
    <text x="44" y="74" font-size="9.5" fill="#fff" fill-opacity="0.58" letter-spacing="0.5">DESIGN</text>
    
    <path d="M190 56 H328 L342 70 L328 84 H190 L204 70 Z" fill="#fff" fill-opacity="0.08" stroke="#fff" stroke-opacity="0.18" stroke-width="1"/>
    <text x="216" y="74" font-size="9.5" fill="#fff" fill-opacity="0.58" letter-spacing="0.5">START-UP</text>
    
    <path d="M346 56 H484 L498 70 L484 84 H346 L360 70 Z" fill="#fff" fill-opacity="0.08" stroke="#fff" stroke-opacity="0.18" stroke-width="1"/>
    <text x="370" y="74" font-size="9.5" fill="#fff" fill-opacity="0.58" letter-spacing="0.5">EXECUTION</text>
    
    <path d="M502 56 H612 V84 H502 L516 70 Z" fill="#fff" fill-opacity="0.08" stroke="#fff" stroke-opacity="0.18" stroke-width="1"/>
    <text x="528" y="74" font-size="9.5" fill="#fff" fill-opacity="0.58" letter-spacing="0.5">CLOSE-OUT</text>
