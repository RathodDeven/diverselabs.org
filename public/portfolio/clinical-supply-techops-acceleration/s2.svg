    <text x="46" y="112" font-size="8.5" fill="#fff" fill-opacity="0.6">A1 · Scope</text>
    <rect x="36" y="128" width="146" height="26" rx="5" fill="#fff" fill-opacity="0.18" stroke="#fff" stroke-opacity="0.14"/>
    <text x="46" y="144" font-size="8.5" fill="#fff" fill-opacity="0.55">A2 · Reqs</text>

    <rect x="196" y="96" width="140" height="26" rx="5" fill="#fff" fill-opacity="0.20" stroke="#fff" stroke-opacity="0.16"/>
    <text x="206" y="112" font-size="8.5" fill="#fff" fill-opacity="0.6">A3 · Build</text>
    <rect x="196" y="128" width="140" height="26" rx="5" fill="#fff" fill-opacity="0.18" stroke="#fff" stroke-opacity="0.14"/>
    <text x="206" y="144" font-size="8.5" fill="#fff" fill-opacity="0.55">A4 · Qualify</text>

