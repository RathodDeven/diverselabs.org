      <text x="38" y="298">A4 Qualify</text>
      <text x="38" y="314">A5 Run</text>
      <text x="38" y="330">A6 Monitor</text>
      <text x="38" y="346">A7 Verify</text>
      <text x="38" y="362">A8 Hand-off</text>
