      <line x1="32" y1="254" x2="572" y2="254"/>
      <line x1="32" y1="270" x2="572" y2="270"/>
      <line x1="32" y1="286" x2="572" y2="286"/>
      <line x1="32" y1="302" x2="572" y2="302"/>
      <line x1="32" y1="318" x2="572" y2="318"/>
      <line x1="32" y1="334" x2="572" y2="334"/>
