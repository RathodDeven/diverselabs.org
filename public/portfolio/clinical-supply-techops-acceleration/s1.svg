<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sprint one: one goal and four objectives">
  <defs><pattern id="cs1" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity="0.05"/></pattern>
  <radialGradient id="cs1v" cx="50%" cy="34%" r="68%"><stop offset="0%" stop-color="#fff" stop-opacity="0.06"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
  <rect width="640" height="400" fill="#0a0a0a"/><rect width="640" height="400" fill="url(#cs1)"/><rect width="640" height="400" fill="url(#cs1v)"/>
  <!-- central goal: crosshair -->
  <g transform="translate(320,118)">
    <circle r="40" fill="#fff" fill-opacity="0.06" stroke="#fff" stroke-opacity="0.85" stroke-width="2.5"/>
    <circle r="24" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="2"/>
    <circle r="6" fill="#fff"/>
    <path d="M0 -52 V-40 M0 40 V52 M-52 0 H-40 M40 0 H52" stroke="#fff" stroke-opacity="0.7" stroke-width="2"/>
  </g>
  <text x="320" y="186" font-family="'JetBrains Mono',monospace" font-size="10" fill="#fff" fill-opacity="0.6" text-anchor="middle">ONE GOAL</text>
  <!-- connectors to 4 objectives -->
  <g stroke="#fff" stroke-opacity="0.3" stroke-width="1.5" fill="none">
