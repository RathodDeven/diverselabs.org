  </g>
  <!-- 4 objective cards -->
  <g>
    <rect x="36" y="244" width="118" height="110" rx="9" fill="#fff" fill-opacity="0.08" stroke="#fff" stroke-opacity="0.45"/>
    <rect x="186" y="244" width="118" height="110" rx="9" fill="#fff" fill-opacity="0.08" stroke="#fff" stroke-opacity="0.45"/>
    <rect x="336" y="244" width="118" height="110" rx="9" fill="#fff" fill-opacity="0.08" stroke="#fff" stroke-opacity="0.45"/>
    <rect x="486" y="244" width="118" height="110" rx="9" fill="#fff" fill-opacity="0.08" stroke="#fff" stroke-opacity="0.45"/>
  </g>
  <g stroke="#fff" stroke-opacity="0.3" stroke-width="4" stroke-linecap="round">
    <path d="M52 300 H138"/><path d="M52 320 H120"/><path d="M202 300 H288"/><path d="M202 320 H270"/><path d="M352 300 H438"/><path d="M352 320 H420"/><path d="M502 300 H588"/><path d="M502 320 H570"/>
