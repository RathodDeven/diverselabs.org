<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Timeline from Friday to Tuesday. The program was joined on Friday with one brief and one prep call, and the two-day client workshop started on Monday with the workshop deck, six evidence posters and a live process-mapping kit ready">
  <defs>
    <pattern id="g" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity="0.05"/></pattern>
    <radialGradient id="gv" cx="50%" cy="38%" r="66%"><stop offset="0%" stop-color="#fff" stop-opacity="0.06"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="640" height="400" fill="#0a0a0a"/>
  <rect width="640" height="400" fill="url(#g)"/>
  <rect width="640" height="400" fill="url(#gv)"/>

  <text x="32" y="34" font-family="'JetBrains Mono',monospace" font-size="10" fill="#fff" fill-opacity="0.5">CLINICAL SUPPLY WORKSHOP · FRIDAY TO MONDAY</text>
  <text x="608" y="34" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.32">NOV 2026</text>

  <!-- day axis -->
  <line x1="80" y1="112" x2="440" y2="112" stroke="#fff" stroke-opacity="0.22" stroke-dasharray="3 5"/>
  <line x1="440" y1="112" x2="560" y2="112" stroke="#fff" stroke-opacity="0.85" stroke-width="3"/>

  <text x="80" y="84" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10" fill="#fff" fill-opacity="0.95">FRI</text>
  <text x="200" y="84" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10" fill="#fff" fill-opacity="0.4">SAT</text>
  <text x="320" y="84" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10" fill="#fff" fill-opacity="0.4">SUN</text>
  <text x="440" y="84" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10" fill="#fff" fill-opacity="0.95">MON</text>
  <text x="560" y="84" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10" fill="#fff" fill-opacity="0.95">TUE</text>

  <circle cx="80" cy="112" r="7" fill="#0a0a0a" stroke="#fff" stroke-opacity="0.85" stroke-width="1.5"/>
  <circle cx="200" cy="112" r="3" fill="#fff" fill-opacity="0.3"/>
  <circle cx="320" cy="112" r="3" fill="#fff" fill-opacity="0.3"/>
  <circle cx="440" cy="112" r="7" fill="#fff" fill-opacity="0.95"/>
  <circle cx="560" cy="112" r="7" fill="#fff" fill-opacity="0.95"/>

  <text x="80" y="142" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.75">JOINED</text>
  <text x="80" y="157" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8" fill="#fff" fill-opacity="0.4">1 brief · 1 prep call</text>

  <text x="260" y="142" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.6">BUILD</text>

  <text x="500" y="142" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.75">CLIENT WORKSHOP</text>
  <text x="500" y="157" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8" fill="#fff" fill-opacity="0.4">two days</text>

  <!-- what was ready -->
  <text x="32" y="204" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.45">READY FOR MONDAY</text>

  <rect x="32" y="218" width="180" height="58" rx="6" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.16"/>
  <text x="122" y="251" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.7">WORKSHOP DECK</text>

  <rect x="230" y="218" width="180" height="58" rx="6" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.16"/>
  <text x="320" y="251" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.7">6 EVIDENCE POSTERS</text>

  <rect x="428" y="218" width="180" height="58" rx="8" fill="#fff" fill-opacity="0.12" stroke="#fff" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="518" y="244" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.95">LIVE MAPPING KIT</text>
  <text x="518" y="260" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8" fill="#fff" fill-opacity="0.6">runs in the client's setup</text>

  <line x1="32" y1="304" x2="608" y2="304" stroke="#fff" stroke-opacity="0.14"/>
  <text x="32" y="332" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.55">HANDOVER · ONE BRIEF · ONE PREP CALL</text>
  <text x="32" y="356" font-family="'JetBrains Mono',monospace" font-size="8" fill="#fff" fill-opacity="0.38">CLIENT ALLOWED NO OUTSIDE TOOLS</text>
  <text x="608" y="356" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="8" fill="#fff" fill-opacity="0.38">ANONYMIZED</text>
</svg>
