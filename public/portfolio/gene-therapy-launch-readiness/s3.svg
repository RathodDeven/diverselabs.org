    <line x1="292" y1="148" x2="316" y2="148" stroke="#fff" stroke-opacity="0.20" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arr)"/>
    <line x1="380" y1="148" x2="404" y2="148" stroke="#fff" stroke-opacity="0.20" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arr)"/>
