    <text x="76" y="250" font-size="9" fill="#fff" fill-opacity="0.5" letter-spacing="0.5">VISION CHECK</text>
    <rect x="76" y="262" width="180" height="9" rx="4" fill="#fff" fill-opacity="0.12"/>
