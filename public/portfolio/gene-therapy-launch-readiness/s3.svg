      <text x="526" y="299" text-anchor="middle" font-size="8" fill="#fff" fill-opacity="0.5">S-04</text>
      <text x="526" y="312" text-anchor="middle" font-size="7" fill="#fff" fill-opacity="0.3">—</text>
      <circle cx="508" cy="290" r="2.4" fill="none" stroke="#fff" stroke-opacity="0.3" stroke-width="1"/>
