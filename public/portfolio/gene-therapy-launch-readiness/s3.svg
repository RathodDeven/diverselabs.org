      <rect x="290" y="104" width="60" height="20" rx="3"/><rect x="354" y="104" width="60" height="20" rx="3"/><rect x="418" y="104" width="60" height="20" rx="3"/><rect x="482" y="104" width="60" height="20" rx="3"/>
      <rect x="290" y="132" width="60" height="20" rx="3"/><rect x="354" y="132" width="60" height="20" rx="3"/><rect x="418" y="132" width="60" height="20" rx="3"/><rect x="482" y="132" width="60" height="20" rx="3"/>
      <rect x="290" y="160" width="60" height="20" rx="3"/><rect x="354" y="160" width="60" height="20" rx="3"/><rect x="418" y="160" width="60" height="20" rx="3"/><rect x="482" y="160" width="60" height="20" rx="3"/>
      <rect x="290" y="188" width="60" height="20" rx="3"/><rect x="354" y="188" width="60" height="20" rx="3"/><rect x="418" y="188" width="60" height="20" rx="3"/><rect x="482" y="188" width="60" height="20" rx="3"/>
      <rect x="290" y="216" width="60" height="20" rx="3"/><rect x="354" y="216" width="60" height="20" rx="3"/><rect x="418" y="216" width="60" height="20" rx="3"/><rect x="482" y="216" width="60" height="20" rx="3"/>
      <rect x="290" y="244" width="60" height="20" rx="3"/><rect x="354" y="244" width="60" height="20" rx="3"/><rect x="418" y="244" width="60" height="20" rx="3"/>
      <rect x="290" y="272" width="60" height="20" rx="3"/><rect x="354" y="272" width="60" height="20" rx="3"/>
