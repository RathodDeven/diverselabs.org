<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Patient-specific order-to-delivery process flow through labelling and kitting finishing suites, stage 3 of 3, with four finishing suites of which two are equipped with vision systems and a cold-chain delivery endpoint">
  <defs>
