<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Risk and gap assessment: a function-by-gap table scored by High, Medium, or Low urgency, paired with a four-stage readiness heatmap. Workstream 2 carries the single critical High-urgency emphasis.">
