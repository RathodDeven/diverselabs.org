<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Demand versus capacity over time with an S&amp;OP capacity line">
  <defs><pattern id="gt2" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity="0.05"/></pattern>
  <radialGradient id="gt2v" cx="50%" cy="40%" r="66%"><stop offset="0%" stop-color="#fff" stop-opacity="0.06"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
  <rect width="640" height="400" fill="#0a0a0a"/><rect width="640" height="400" fill="url(#gt2)"/><rect width="640" height="400" fill="url(#gt2v)"/>
  <path d="M96 320 H560 M96 320 V70" stroke="#fff" stroke-opacity="0.45" stroke-width="2" fill="none" stroke-linecap="round"/>
  <g stroke="#fff" stroke-opacity="0.1" stroke-width="1"><path d="M96 260 H560"/><path d="M96 200 H560"/><path d="M96 140 H560"/></g>
