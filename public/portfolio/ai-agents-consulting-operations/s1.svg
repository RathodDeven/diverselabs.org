<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Architecture of an RFP-response agent: the firm's proposal library, case studies and team bios feed a retrieval step into the agent, which produces a first-pass draft that consultants edit instead of drafting from blank">
