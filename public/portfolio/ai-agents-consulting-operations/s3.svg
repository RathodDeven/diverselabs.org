  <line x1="32" y1="356" x2="608" y2="356" stroke="#fff" stroke-opacity="0.14"/>
  <text x="32" y="380" font-family="'JetBrains Mono',monospace" font-size="8" fill="#fff" fill-opacity="0.38">INTERNAL BUILD AT A BOUTIQUE CONSULTANCY · TRAIN FIRST, THEN SHIP</text>
