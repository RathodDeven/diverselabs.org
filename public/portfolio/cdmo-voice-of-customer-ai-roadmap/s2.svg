  <circle cx="40" cy="348" r="2.4" fill="#fff" fill-opacity="0.6"/>
  <text x="52" y="351" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#fff" fill-opacity="0.5">Recurring checkpoint</text>

