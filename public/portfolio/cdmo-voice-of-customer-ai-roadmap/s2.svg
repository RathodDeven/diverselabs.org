  <text x="232" y="351" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#fff" fill-opacity="0.5">Periodic roll-up</text>

  <circle cx="372" cy="348" r="6" fill="#fff" fill-opacity="1"/>
  <path d="M369 348 l2 2 l4 -4.5" fill="none" stroke="#0a0a0a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="384" y="351" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#fff" fill-opacity="0.6">Anchor cadence</text>

  <text x="32" y="372" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.45">Review tiers mapped to recurring intervals</text>
