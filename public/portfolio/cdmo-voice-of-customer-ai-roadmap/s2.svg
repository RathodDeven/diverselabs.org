  <line x1="294" y1="252" x2="306" y2="252" stroke="#fff" stroke-opacity="0.16" stroke-width="1.3" stroke-linecap="round"/>
  
  <line x1="398" y1="252" x2="410" y2="252" stroke="#fff" stroke-opacity="0.16" stroke-width="1.3" stroke-linecap="round"/>
  
  <circle cx="508" cy="252" r="9" fill="#fff" fill-opacity="0.30"/>
  <circle cx="508" cy="252" r="3" fill="#fff" fill-opacity="0.6"/>
  <text x="556" y="256" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#fff" fill-opacity="0.5">Owner C</text>

  <line x1="32" y1="328" x2="608" y2="328" stroke="#fff" stroke-opacity="0.12" stroke-width="1"/>

