<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Quality assessment cadence grid mapping three review tiers against weekly, monthly, and quarterly intervals with scheduled checkpoints, owners, and a status legend">
  <defs>
    <pattern id="g" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity="0.05"/></pattern>
    <radialGradient id="gv" cx="50%" cy="38%" r="66%"><stop offset="0%" stop-color="#fff" stop-opacity="0.06"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="640" height="400" fill="#0a0a0a"/>
  <rect width="640" height="400" fill="url(#g)"/>
  <rect width="640" height="400" fill="url(#gv)"/>

  <text x="32" y="34" font-family="'JetBrains Mono',monospace" font-size="10" fill="#fff" fill-opacity="0.5">QUALITY ASSESSMENT CADENCE</text>
  <text x="608" y="34" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.32">02 / 03</text>

  <text x="300" y="78" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9.5" fill="#fff" fill-opacity="0.55">WEEKLY</text>
  <text x="404" y="78" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9.5" fill="#fff" fill-opacity="0.55">MONTHLY</text>
  <text x="508" y="78" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9.5" fill="#fff" fill-opacity="0.55">QUARTERLY</text>
  <text x="556" y="78" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#fff" fill-opacity="0.4">OWNER</text>

  <line x1="252" y1="88" x2="252" y2="312" stroke="#fff" stroke-opacity="0.16" stroke-width="1"/>
  <line x1="356" y1="88" x2="356" y2="312" stroke="#fff" stroke-opacity="0.16" stroke-width="1"/>
  <line x1="460" y1="88" x2="460" y2="312" stroke="#fff" stroke-opacity="0.16" stroke-width="1"/>
  <line x1="540" y1="88" x2="540" y2="312" stroke="#fff" stroke-opacity="0.16" stroke-width="1"/>

