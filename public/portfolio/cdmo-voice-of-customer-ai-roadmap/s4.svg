<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Price-elasticity willingness-to-pay band: buyer acceptance stays high through a tolerable premium band up to about plus 25 percent above market, then collapses past the walk-away threshold, with the firm's early-phase quote at roughly two times market far beyond the band">
  <defs>
    <pattern id="g" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity="0.05"/></pattern>
    <radialGradient id="gv" cx="50%" cy="38%" r="66%"><stop offset="0%" stop-color="#fff" stop-opacity="0.06"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="640" height="400" fill="#0a0a0a"/><rect width="640" height="400" fill="url(#g)"/><rect width="640" height="400" fill="url(#gv)"/>

  <text x="32" y="34" font-family="'JetBrains Mono',monospace" font-size="10" fill="#fff" fill-opacity="0.5">PRICE ELASTICITY · WILLINGNESS-TO-PAY BAND</text>
  <text x="608" y="34" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.32">WON vs LOST · 9 DIMENSIONS</text>

  <line x1="120" y1="80" x2="120" y2="250" stroke="#fff" stroke-opacity="0.16" stroke-width="1"/>
  <line x1="120" y1="250" x2="588" y2="250" stroke="#fff" stroke-opacity="0.16" stroke-width="1"/>

  <line x1="116" y1="90" x2="120" y2="90" stroke="#fff" stroke-opacity="0.3"/>
  <line x1="116" y1="170" x2="120" y2="170" stroke="#fff" stroke-opacity="0.3"/>
  <text x="110" y="93" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="8" fill="#fff" fill-opacity="0.42">100%</text>
  <text x="110" y="173" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="8" fill="#fff" fill-opacity="0.42">50%</text>
  <text x="110" y="253" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="8" fill="#fff" fill-opacity="0.42">0%</text>
  <text x="40" y="175" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#fff" fill-opacity="0.4" transform="rotate(-90 40 175)">BUYER ACCEPTANCE</text>

  <rect x="120" y="80" width="73" height="170" fill="#fff" fill-opacity="0.13"/>
  <line x1="120" y1="80" x2="193" y2="80" stroke="#fff" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="126" y="98" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.85">TOLERABLE</text>
  <text x="126" y="110" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.85">PREMIUM BAND</text>
  <text x="126" y="124" font-family="'JetBrains Mono',monospace" font-size="7.5" fill="#fff" fill-opacity="0.55">accepted when transfer</text>
  <text x="126" y="134" font-family="'JetBrains Mono',monospace" font-size="7.5" fill="#fff" fill-opacity="0.55">risk is high / know-how</text>

  <line x1="193" y1="72" x2="193" y2="250" stroke="#fff" stroke-opacity="0.55" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="197" y="70" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#fff" fill-opacity="0.7">WALK-AWAY THRESHOLD ~+25%</text>

  <text x="300" y="150" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.6">PREMIUM REJECTED</text>
  <text x="300" y="162" font-family="'JetBrains Mono',monospace" font-size="8" fill="#fff" fill-opacity="0.45">acceptance collapses · clients walk</text>

  <path d="M120 102 C 152 106, 174 114, 193 124 C 224 146, 244 168, 268 190 C 312 224, 364 236, 413 242 C 462 246, 510 248, 560 249" fill="none" stroke="#fff" stroke-opacity="0.92" stroke-width="2"/>
  <circle cx="120" cy="102" r="3" fill="#fff" fill-opacity="0.9"/>
  <circle cx="193" cy="124" r="3" fill="#fff" fill-opacity="0.9"/>

  <line x1="413" y1="150" x2="413" y2="250" stroke="#fff" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="4 3"/>
  <circle cx="413" cy="242" r="4.5" fill="#fff"/>
  <text x="413" y="142" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.85">FIRM EARLY-PHASE QUOTE</text>
  <text x="413" y="154" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8" fill="#fff" fill-opacity="0.55">≈ 2× market · ~5% accept</text>

  <text x="120" y="266" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8" fill="#fff" fill-opacity="0.5">MARKET</text>
  <text x="120" y="277" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="7.5" fill="#fff" fill-opacity="0.35">rivals' price</text>
  <text x="193" y="266" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8" fill="#fff" fill-opacity="0.5">+25%</text>
  <text x="413" y="266" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8" fill="#fff" fill-opacity="0.5">~2× MARKET</text>
  <text x="354" y="294" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#fff" fill-opacity="0.4">PRICE PREMIUM OVER LOW-COST RIVALS  &#8594;</text>

  <text x="32" y="372" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.45">Willingness-to-pay band, buyers accept a premium only to ~+25%; the firm's early-phase quote sits far beyond it</text>
</svg>
