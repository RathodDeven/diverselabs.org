<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Five-phase project plan as a cascading Gantt chart">
  <defs>
    <pattern id="q1" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.05"/></pattern>
    <radialGradient id="q1v" cx="50%" cy="38%" r="68%"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="640" height="400" fill="#0a0a0a"/><rect width="640" height="400" fill="url(#q1)"/><rect width="640" height="400" fill="url(#q1v)"/>

  <!-- month headers -->
  <g fill="#ffffff" fill-opacity="0.4" font-family="'JetBrains Mono',monospace" font-size="10" text-anchor="middle">
    <text x="243" y="74">MONTH 1</text><text x="410" y="74">MONTH 2</text><text x="560" y="74">MONTH 3</text>
  </g>
  <!-- timeline grid -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1">
    <path d="M160 84 V330"/><path d="M243 84 V330"/><path d="M327 84 V330"/><path d="M410 84 V330"/><path d="M494 84 V330"/><path d="M577 84 V330"/>
  </g>
  <path d="M150 330 H626" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- phase rows: labels + cascading bars -->
  <g font-family="'JetBrains Mono',monospace" font-size="10.5" fill="#ffffff" fill-opacity="0.6">
    <text x="20" y="122">ASSESS</text>
    <text x="20" y="166">GAP</text>
    <text x="20" y="210">MODEL</text>
    <text x="20" y="254">READOUT</text>
    <text x="20" y="298">EXECUTE</text>
  </g>
  <g>
    <rect x="160" y="106" width="128" height="24" rx="5" fill="#ffffff" fill-opacity="0.30" stroke="#ffffff" stroke-opacity="0.7"/>
    <rect x="244" y="150" width="125" height="24" rx="5" fill="#ffffff" fill-opacity="0.26" stroke="#ffffff" stroke-opacity="0.65"/>
    <rect x="327" y="194" width="125" height="24" rx="5" fill="#ffffff" fill-opacity="0.22" stroke="#ffffff" stroke-opacity="0.6"/>
    <rect x="411" y="238" width="125" height="24" rx="5" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.55"/>
    <rect x="494" y="282" width="126" height="24" rx="5" fill="#ffffff" fill-opacity="0.32" stroke="#ffffff" stroke-opacity="0.85"/>
  </g>
  <!-- deliverable milestones -->
  <g fill="#ffffff">
    <path d="M288 118 l8 -8 8 8 -8 8 z" transform="translate(-8,0)"/>
    <path d="M452 206 l8 -8 8 8 -8 8 z" transform="translate(-8,0)"/>
    <path d="M620 294 l8 -8 8 8 -8 8 z" transform="translate(-16,0)"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.45" font-family="'JetBrains Mono',monospace" font-size="8.5" text-anchor="middle">
    <text x="300" y="100">D1</text><text x="464" y="188">D2</text><text x="612" y="276">D3</text>
  </g>
</svg>
