<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Future-state operating model: roles split across two functions with a defined handoff">
  <defs>
    <pattern id="q3" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.05"/></pattern>
    <radialGradient id="q3v" cx="50%" cy="40%" r="66%"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="640" height="400" fill="#0a0a0a"/><rect width="640" height="400" fill="url(#q3)"/><rect width="640" height="400" fill="url(#q3v)"/>

  <!-- two function columns -->
  <g font-family="'JetBrains Mono',monospace" font-size="10" fill="#ffffff" fill-opacity="0.5" text-anchor="middle">
    <text x="135" y="80">QUALITY PARTNERS</text>
    <text x="505" y="80">VENDOR MANAGEMENT</text>
  </g>
  <rect x="40" y="92" width="190" height="248" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
  <rect x="410" y="92" width="190" height="248" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>

  <!-- left nodes -->
  <g>
    <rect x="60" y="116" width="150" height="40" rx="7" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.5"/>
    <rect x="60" y="172" width="150" height="40" rx="7" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.45"/>
    <rect x="60" y="228" width="150" height="40" rx="7" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.45"/>
    <rect x="60" y="284" width="150" height="40" rx="7" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.45"/>
  </g>
  <!-- right nodes -->
  <g>
    <rect x="430" y="116" width="150" height="40" rx="7" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.5"/>
    <rect x="430" y="172" width="150" height="40" rx="7" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.45"/>
    <rect x="430" y="228" width="150" height="40" rx="7" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.45"/>
    <rect x="430" y="284" width="150" height="40" rx="7" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.45"/>
  </g>
  <!-- node tick marks -->
  <g fill="#ffffff" fill-opacity="0.6">
    <circle cx="76" cy="136" r="3"/><circle cx="76" cy="192" r="3"/><circle cx="76" cy="248" r="3"/><circle cx="76" cy="304" r="3"/>
    <circle cx="446" cy="136" r="3"/><circle cx="446" cy="192" r="3"/><circle cx="446" cy="248" r="3"/><circle cx="446" cy="304" r="3"/>
  </g>

  <!-- central handoff -->
  <circle cx="320" cy="210" r="34" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2"/>
  <text x="320" y="206" font-family="'JetBrains Mono',monospace" font-size="9" fill="#ffffff" text-anchor="middle">HAND</text>
  <text x="320" y="218" font-family="'JetBrains Mono',monospace" font-size="9" fill="#ffffff" text-anchor="middle">OFF</text>

  <!-- flows into handoff -->
  <g stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" fill="none">
    <path d="M210 136 C 270 140, 270 190, 288 200"/>
    <path d="M210 304 C 270 300, 270 230, 288 220"/>
    <path d="M430 136 C 370 140, 370 190, 352 200"/>
    <path d="M430 304 C 370 300, 370 230, 352 220"/>
  </g>
  <!-- escalation arrow across -->
  <path d="M286 250 H354" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="5 5"/>
</svg>
