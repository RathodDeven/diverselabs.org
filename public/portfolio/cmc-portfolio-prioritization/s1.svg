  <text x="100" y="328" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.5">RECONSIDER</text>
  <text x="576" y="328" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.5">QUICK WIN</text>

