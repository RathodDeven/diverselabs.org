  <circle cx="160" cy="270" r="15" fill="#fff" fill-opacity="0.18" stroke="#fff" stroke-opacity="0.24" stroke-width="1"/>
  <text x="160" y="273" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#fff" fill-opacity="0.5">P6</text>
  <circle cx="245" cy="300" r="22" fill="#fff" fill-opacity="0.20" stroke="#fff" stroke-opacity="0.26" stroke-width="1"/>
  <text x="245" y="303" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#fff" fill-opacity="0.5">P7</text>

  <circle cx="445" cy="285" r="18" fill="#fff" fill-opacity="0.19" stroke="#fff" stroke-opacity="0.26" stroke-width="1"/>
  <text x="445" y="288" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#fff" fill-opacity="0.5">P8</text>
  <circle cx="525" cy="255" r="11" fill="#fff" fill-opacity="0.18" stroke="#fff" stroke-opacity="0.24" stroke-width="1"/>
  <text x="525" y="258" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8" fill="#fff" fill-opacity="0.5">P9</text>

  <circle cx="478" cy="318" r="4" fill="#fff" fill-opacity="0.3"/>
  <circle cx="500" cy="318" r="7" fill="#fff" fill-opacity="0.3"/>
  <text x="514" y="321" font-family="'JetBrains Mono',monospace" font-size="8" fill="#fff" fill-opacity="0.45">RESOURCE</text>

  <text x="32" y="372" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.45">Value-vs-feasibility matrix sizing CMC projects by resource demand</text>
