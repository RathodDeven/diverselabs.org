<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Value-versus-feasibility 2x2 bubble matrix prioritizing CMC projects; bubbles sized by resource demand; the high-value high-feasibility Do-First quadrant is emphasized">
  <defs>
    <pattern id="g" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity="0.05"/></pattern>
    <radialGradient id="gv" cx="50%" cy="38%" r="66%"><stop offset="0%" stop-color="#fff" stop-opacity="0.06"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="640" height="400" fill="#0a0a0a"/>
  <rect width="640" height="400" fill="url(#g)"/>
  <rect width="640" height="400" fill="url(#gv)"/>

  <text x="32" y="34" font-family="'JetBrains Mono',monospace" font-size="10" fill="#fff" fill-opacity="0.5">PORTFOLIO PRIORITIZATION · VALUE × FEASIBILITY</text>
  <text x="608" y="34" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.32">01 / 03</text>

  <rect x="88" y="60" width="500" height="278" rx="8" fill="none" stroke="#fff" stroke-opacity="0.14" stroke-width="1"/>

  <rect x="338" y="60" width="250" height="139" rx="6" fill="#fff" fill-opacity="0.05"/>

  <line x1="338" y1="60" x2="338" y2="338" stroke="#fff" stroke-opacity="0.18" stroke-width="1.25" stroke-dasharray="2 5"/>
  <line x1="88" y1="199" x2="588" y2="199" stroke="#fff" stroke-opacity="0.18" stroke-width="1.25" stroke-dasharray="2 5"/>

  <text x="84" y="64" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#fff" fill-opacity="0.45">HIGH</text>
  <text x="84" y="338" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#fff" fill-opacity="0.45">LOW</text>
  <text x="58" y="203" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9.5" fill="#fff" fill-opacity="0.55" transform="rotate(-90 58 203)">VALUE / IMPACT</text>

  <text x="120" y="354" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#fff" fill-opacity="0.45">HARD</text>
