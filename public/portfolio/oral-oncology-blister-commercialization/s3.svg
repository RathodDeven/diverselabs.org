<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gantt chart of a blister packaging qualification and validation plan: task duration bars across twelve weeks, with PSB manufacture and On stability milestone diamonds and a downstream PQ/PPQ band.">
