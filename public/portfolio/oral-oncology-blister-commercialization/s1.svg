  <text x="464" y="78" font-size="9" fill="#fff" fill-opacity="0.45">Comparator &amp;</text>
  <text x="464" y="90" font-size="9" fill="#fff" fill-opacity="0.45">biosimilar benchmark</text>
  <line x1="464" y1="100" x2="600" y2="100" stroke="#fff" stroke-opacity="0.12" stroke-width="1"/>

  <rect x="464" y="114" width="136" height="34" rx="6" fill="#fff" fill-opacity="0.04" stroke="#fff" stroke-opacity="0.12" stroke-width="1"/>
  <text x="474" y="129" font-size="9" fill="#fff" fill-opacity="0.5">Comparator A</text>
  <text x="474" y="141" font-size="8" fill="#fff" fill-opacity="0.3">blister</text>

  <rect x="464" y="156" width="136" height="34" rx="6" fill="#fff" fill-opacity="0.04" stroke="#fff" stroke-opacity="0.12" stroke-width="1"/>
  <text x="474" y="171" font-size="9" fill="#fff" fill-opacity="0.5">Comparator B</text>
  <text x="474" y="183" font-size="8" fill="#fff" fill-opacity="0.3">bottle</text>

  <rect x="464" y="198" width="136" height="34" rx="6" fill="#fff" fill-opacity="0.04" stroke="#fff" stroke-opacity="0.12" stroke-width="1"/>
  <text x="474" y="213" font-size="9" fill="#fff" fill-opacity="0.5">Biosimilar</text>
  <text x="474" y="225" font-size="8" fill="#fff" fill-opacity="0.3">unit-of-use blister</text>

  <text x="468" y="254" font-size="8" fill="#fff" fill-opacity="0.4">informs</text>
