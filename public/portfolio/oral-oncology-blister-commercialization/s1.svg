  <path d="M442 264 l 9 -4 l -2 4 l 2 4 z" fill="#fff" fill-opacity="0.22"/>

  <text x="32" y="372" font-size="9" fill="#fff" fill-opacity="0.45">Format trade-off, benchmarked against comparator and biosimilar presentations; blister chosen</text>
</svg>
