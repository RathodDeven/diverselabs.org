  <rect x="204" y="233" width="48" height="6" rx="3" fill="#fff" fill-opacity="0.3"/>
  <rect x="326" y="233" width="98" height="6" rx="3" fill="#fff" fill-opacity="0.22"/>
  <rect x="326" y="233" width="52" height="6" rx="3" fill="#fff" fill-opacity="0.4"/>

