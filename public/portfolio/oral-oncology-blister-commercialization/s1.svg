  <text x="32" y="34" font-size="10" fill="#fff" fill-opacity="0.5" letter-spacing="1.5">FORMAT · BLISTER vs BOTTLE</text>
  <text x="612" y="34" text-anchor="end" font-size="9" fill="#fff" fill-opacity="0.32">01 / 03</text>

  <rect x="32" y="56" width="404" height="234" rx="8" fill="none" stroke="#fff" stroke-opacity="0.14" stroke-width="1"/>

  <line x1="192" y1="56" x2="192" y2="290" stroke="#fff" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="314" y1="56" x2="314" y2="290" stroke="#fff" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="32" y1="104" x2="436" y2="104" stroke="#fff" stroke-opacity="0.12" stroke-width="1"/>

  <rect x="314" y="56" width="122" height="234" rx="8" fill="#fff" fill-opacity="0.05"/>
  <rect x="314.75" y="56.75" width="120.5" height="232.5" rx="8" fill="none" stroke="#fff" stroke-opacity="0.85" stroke-width="1.5"/>

  <path d="M255 78 h12 v-5 h6 v5 q7 2 7 10 v7 q0 3 -3 3 h-26 q-3 0 -3 -3 v-7 q0 -8 7 -10 z" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="1.2" stroke-linejoin="round"/>
  <text x="253" y="100" font-size="11" fill="#fff" fill-opacity="0.6">Bottle</text>

  <rect x="356" y="74" width="28" height="20" rx="3" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="1.2"/>
  <circle cx="363" cy="80" r="2.1" fill="#fff" fill-opacity="0.4"/>
  <circle cx="377" cy="80" r="2.1" fill="#fff" fill-opacity="0.4"/>
  <circle cx="363" cy="88" r="2.1" fill="#fff" fill-opacity="0.4"/>
  <circle cx="377" cy="88" r="2.1" fill="#fff" fill-opacity="0.4"/>
  <text x="348" y="100" font-size="11" fill="#fff" fill-opacity="0.62">Blister</text>

  <rect x="345" y="60" width="58" height="14" rx="4" fill="#fff"/>
  <text x="374" y="70" text-anchor="middle" font-size="8" fill="#0a0a0a" letter-spacing="1">CHOSEN</text>

  
  <text x="44" y="136" font-size="10" fill="#fff" fill-opacity="0.5">Barrier</text>
