<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two-column comparison scorecard rating Bottle versus Blister across barrier, shelf-life, unit-of-use, tooling and cost; blister selected for the unit-of-use presentation">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="13" r="1" fill="#fff" fill-opacity="0.05"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="38%" r="66%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="640" height="400" fill="#0a0a0a"/>
  <rect x="0" y="0" width="640" height="400" fill="url(#dots)"/>
  <rect x="0" y="0" width="640" height="400" fill="url(#vig)"/>

  <text x="32" y="34" font-family="'JetBrains Mono',monospace" font-size="10" fill="#fff" fill-opacity="0.5" letter-spacing="1.5">PACKAGING FORMAT · BLISTER vs BOTTLE</text>
  <text x="612" y="34" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.32">01 / 03</text>

  <g font-family="'JetBrains Mono',monospace">
    
    <rect x="338" y="62" width="128" height="48" rx="8" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.14" stroke-width="1"/>
    <path d="M373 78 h6 v-4 h6 v4 h6 a8 8 0 0 1 8 8 v14 a4 4 0 0 1 -4 4 h-26 a4 4 0 0 1 -4 -4 v-14 a8 8 0 0 1 8 -8 z" fill="none" stroke="#fff" stroke-opacity="0.20" stroke-width="1.2" stroke-linejoin="round"/>
    <text x="408" y="92" font-size="11" fill="#fff" fill-opacity="0.58" letter-spacing="0.5">Bottle</text>

    <rect x="478" y="62" width="128" height="48" rx="8" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.18" stroke-width="1"/>
    <rect x="513" y="74" width="28" height="22" rx="3" fill="none" stroke="#fff" stroke-opacity="0.20" stroke-width="1.2"/>
    <circle cx="520" cy="81" r="2" fill="#fff" fill-opacity="0.22"/>
    <circle cx="527" cy="81" r="2" fill="#fff" fill-opacity="0.22"/>
    <circle cx="534" cy="81" r="2" fill="#fff" fill-opacity="0.22"/>
    <circle cx="520" cy="89" r="2" fill="#fff" fill-opacity="0.22"/>
    <circle cx="527" cy="89" r="2" fill="#fff" fill-opacity="0.22"/>
    <circle cx="534" cy="89" r="2" fill="#fff" fill-opacity="0.22"/>
    <text x="548" y="92" font-size="11" fill="#fff" fill-opacity="0.58" letter-spacing="0.5">Blister</text>
  </g>

  <rect x="478" y="118" width="128" height="206" rx="8" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="542" y="316" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#ffffff" fill-opacity="0.95" letter-spacing="2">CHOSEN</text>

  <g font-family="'JetBrains Mono',monospace">
    
    <line x1="32" y1="155" x2="606" y2="155" stroke="#fff" stroke-opacity="0.12" stroke-width="1"/>
    <text x="32" y="138" font-size="10" fill="#fff" fill-opacity="0.5">Barrier</text>
    <rect x="352" y="129" width="60" height="6" rx="3" fill="#fff" fill-opacity="0.10"/>
    <rect x="352" y="129" width="32" height="6" rx="3" fill="#fff" fill-opacity="0.22"/>
    <rect x="492" y="129" width="60" height="6" rx="3" fill="#fff" fill-opacity="0.12"/>
    <rect x="492" y="129" width="52" height="6" rx="3" fill="#fff" fill-opacity="0.40"/>

    <line x1="32" y1="196" x2="606" y2="196" stroke="#fff" stroke-opacity="0.12" stroke-width="1"/>
    <text x="32" y="179" font-size="10" fill="#fff" fill-opacity="0.5">Shelf-life</text>
    <rect x="352" y="170" width="60" height="6" rx="3" fill="#fff" fill-opacity="0.10"/>
    <rect x="352" y="170" width="40" height="6" rx="3" fill="#fff" fill-opacity="0.22"/>
    <rect x="492" y="170" width="60" height="6" rx="3" fill="#fff" fill-opacity="0.12"/>
    <rect x="492" y="170" width="44" height="6" rx="3" fill="#fff" fill-opacity="0.36"/>

    <line x1="32" y1="237" x2="606" y2="237" stroke="#fff" stroke-opacity="0.12" stroke-width="1"/>
    <text x="32" y="220" font-size="10" fill="#fff" fill-opacity="0.5">Unit-of-use</text>
    <rect x="352" y="211" width="60" height="6" rx="3" fill="#fff" fill-opacity="0.10"/>
    <rect x="352" y="211" width="20" height="6" rx="3" fill="#fff" fill-opacity="0.20"/>
    <rect x="492" y="211" width="60" height="6" rx="3" fill="#fff" fill-opacity="0.12"/>
    <rect x="492" y="211" width="58" height="6" rx="3" fill="#fff" fill-opacity="0.40"/>

    <line x1="32" y1="278" x2="606" y2="278" stroke="#fff" stroke-opacity="0.12" stroke-width="1"/>
    <text x="32" y="261" font-size="10" fill="#fff" fill-opacity="0.5">Tooling</text>
    <rect x="352" y="252" width="60" height="6" rx="3" fill="#fff" fill-opacity="0.12"/>
    <rect x="352" y="252" width="46" height="6" rx="3" fill="#fff" fill-opacity="0.30"/>
    <rect x="492" y="252" width="60" height="6" rx="3" fill="#fff" fill-opacity="0.10"/>
    <rect x="492" y="252" width="30" height="6" rx="3" fill="#fff" fill-opacity="0.22"/>

    <text x="32" y="301" font-size="10" fill="#fff" fill-opacity="0.5">Cost</text>
    <rect x="352" y="292" width="60" height="6" rx="3" fill="#fff" fill-opacity="0.12"/>
    <rect x="352" y="292" width="48" height="6" rx="3" fill="#fff" fill-opacity="0.30"/>
    <rect x="492" y="292" width="60" height="6" rx="3" fill="#fff" fill-opacity="0.10"/>
    <rect x="492" y="292" width="36" height="6" rx="3" fill="#fff" fill-opacity="0.22"/>
  </g>

  <line x1="150" y1="118" x2="150" y2="324" stroke="#fff" stroke-opacity="0.12" stroke-width="1"/>

  <text x="32" y="372" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.45">Format trade-off; blister selected for the unit-of-use presentation</text>
</svg>
