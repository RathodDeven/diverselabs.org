<svg viewBox="0 0 640 400" role="img" aria-label="Format comparison scorecard: Bottle versus Blister across barrier, shelf-life, unit-of-use, tooling and cost, with Blister chosen as the unit-of-use direction, informed by a comparator and biosimilar benchmark band." xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono',monospace">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="13" r="1" fill="#fff" fill-opacity="0.05"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="38%" r="66%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="640" height="400" fill="#0a0a0a"/>
