  <circle cx="410" cy="130" r="14" fill="#fff" fill-opacity="0.08" stroke="#fff" stroke-opacity="0.4" stroke-width="2"/>
  <!-- packaging -->
  <circle cx="410" cy="185" r="26" fill="#fff" fill-opacity="0.16" stroke="#fff" stroke-opacity="0.85" stroke-width="2.5"/>
  <!-- distribution (2) -->
  <g fill="#fff" fill-opacity="0.2" stroke="#fff" stroke-opacity="0.7" stroke-width="2"><circle cx="560" cy="160" r="16"/><circle cx="560" cy="240" r="16"/></g>
