<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Launch supply plan: staged production-flow timeline from raw material to finished good across a monthly axis, with filing and approval milestones and a launch marker, bracketed by total cumulative lead time">
  <defs>
    <pattern id="g" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity="0.05"/></pattern>
    <radialGradient id="gv" cx="50%" cy="38%" r="66%"><stop offset="0%" stop-color="#fff" stop-opacity="0.06"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="640" height="400" fill="#0a0a0a"/>
  <rect width="640" height="400" fill="url(#g)"/>
  <rect width="640" height="400" fill="url(#gv)"/>

  <text x="32" y="34" font-family="'JetBrains Mono',monospace" font-size="10" fill="#fff" fill-opacity="0.5">LAUNCH SUPPLY PLAN · STAGED LEAD TIME</text>
  <text x="608" y="34" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.32">01 / 03</text>

  <line x1="158" y1="300" x2="588" y2="300" stroke="#fff" stroke-opacity="0.18" stroke-width="1"/>

  <g stroke="#fff" stroke-opacity="0.12" stroke-width="1">
    <line x1="158" y1="120" x2="158" y2="300"/>
    <line x1="212" y1="120" x2="212" y2="300"/>
    <line x1="266" y1="120" x2="266" y2="300"/>
    <line x1="320" y1="120" x2="320" y2="300"/>
    <line x1="373" y1="120" x2="373" y2="300"/>
    <line x1="427" y1="120" x2="427" y2="300"/>
    <line x1="481" y1="120" x2="481" y2="300"/>
    <line x1="534" y1="120" x2="534" y2="300"/>
    <line x1="588" y1="120" x2="588" y2="300"/>
  </g>

  <g font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#fff" fill-opacity="0.45" text-anchor="middle">
    <text x="158" y="314">M-24</text>
    <text x="212" y="314">M-21</text>
    <text x="266" y="314">M-18</text>
    <text x="320" y="314">M-15</text>
    <text x="373" y="314">M-12</text>
    <text x="427" y="314">M-09</text>
    <text x="481" y="314">M-06</text>
    <text x="534" y="314">M-03</text>
    <text x="588" y="314">LAUNCH</text>
  </g>

  <g font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.55" text-anchor="end">
    <text x="148" y="146">Raw Material</text>
    <text x="148" y="178">Drug Substance</text>
    <text x="148" y="210">Drug Product</text>
    <text x="148" y="242">Finished Good</text>
    <text x="148" y="274">Distribution</text>
  </g>

  <g stroke-linecap="round">
    <rect x="158" y="138" width="150" height="16" rx="5" fill="#fff" fill-opacity="0.20"/>
    <rect x="244" y="170" width="158" height="16" rx="5" fill="#fff" fill-opacity="0.24"/>
    <rect x="346" y="202" width="150" height="16" rx="5" fill="#fff" fill-opacity="0.28"/>
    <rect x="438" y="234" width="96" height="16" rx="5" fill="#fff" fill-opacity="0.32"/>
    <rect x="510" y="266" width="78" height="16" rx="5" fill="#fff" fill-opacity="0.36"/>
  </g>

  <g stroke="#fff" stroke-opacity="0.16" stroke-width="1" fill="none">
    <path d="M308 154 L308 162 L244 162 L244 170"/>
    <path d="M402 186 L402 194 L346 194 L346 202"/>
    <path d="M496 218 L496 226 L438 226 L438 234"/>
    <path d="M534 250 L534 258 L510 258 L510 266"/>
  </g>

  <g>
    <path d="M373 96 l9 9 l-9 9 l-9 -9 z" fill="#fff" fill-opacity="0.4" stroke="#fff" stroke-opacity="0.55" stroke-width="1"/>
    <line x1="373" y1="114" x2="373" y2="300" stroke="#fff" stroke-opacity="0.16" stroke-width="1" stroke-dasharray="3 4"/>
    <text x="373" y="84" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#fff" fill-opacity="0.5" text-anchor="middle">Filing</text>

    <path d="M510 96 l9 9 l-9 9 l-9 -9 z" fill="#fff" fill-opacity="0.4" stroke="#fff" stroke-opacity="0.55" stroke-width="1"/>
    <line x1="510" y1="114" x2="510" y2="300" stroke="#fff" stroke-opacity="0.16" stroke-width="1" stroke-dasharray="3 4"/>
    <text x="510" y="84" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#fff" fill-opacity="0.5" text-anchor="middle">Approval</text>
  </g>

  <g>
    <line x1="588" y1="120" x2="588" y2="300" stroke="#fff" stroke-opacity="0.9" stroke-width="1.5"/>
    <path d="M588 96 l10 10 l-10 10 l-10 -10 z" fill="#fff"/>
    <text x="588" y="106" font-family="'JetBrains Mono',monospace" font-size="9" font-weight="bold" fill="#0a0a0a" text-anchor="middle">L</text>
    <text x="588" y="84" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.95" text-anchor="middle" font-weight="bold">LAUNCH</text>
  </g>

  <g stroke="#fff" stroke-opacity="0.45" stroke-width="1" fill="none">
    <path d="M158 60 L158 52 L588 52 L588 60"/>
  </g>
  <text x="373" y="46" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.55" text-anchor="middle">TOTAL CUMULATIVE LEAD TIME · ~24 MONTHS</text>

  <text x="32" y="372" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.45">Staged production-flow timeline from raw material to finished good, anchored to launch.</text>
</svg>
