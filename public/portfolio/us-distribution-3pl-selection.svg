<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three candidate columns scored, the middle one selected">
  <defs>
    <pattern id="g6" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.05"/></pattern>
    <radialGradient id="v6" cx="50%" cy="38%" r="66%"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="640" height="400" fill="#0a0a0a"/><rect width="640" height="400" fill="url(#g6)"/><rect width="640" height="400" fill="url(#v6)"/>
  <!-- three candidate cards -->
  <g>
    <rect x="92" y="120" width="132" height="200" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>
    <rect x="254" y="96" width="132" height="224" rx="10" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.9" stroke-width="2.5"/>
    <rect x="416" y="120" width="132" height="200" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>
  </g>
  <!-- score bars within each -->
  <g stroke-linecap="round">
    <g stroke="#ffffff" stroke-opacity="0.3" stroke-width="6">
      <path d="M112 160 H180"/><path d="M112 185 H164"/><path d="M112 210 H188"/>
    </g>
    <g stroke="#ffffff" stroke-opacity="0.85" stroke-width="6">
      <path d="M274 150 H352"/><path d="M274 175 H344"/><path d="M274 200 H356"/>
    </g>
    <g stroke="#ffffff" stroke-opacity="0.3" stroke-width="6">
      <path d="M436 160 H500"/><path d="M436 185 H512"/><path d="M436 210 H486"/>
    </g>
  </g>
  <!-- selected check -->
  <circle cx="320" cy="280" r="20" fill="#ffffff"/>
  <path d="M310 280 l7 7 14 -15" stroke="#0a0a0a" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
