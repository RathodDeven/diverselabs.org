<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ascending maturity staircase across five levels">
  <defs>
    <pattern id="g3" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.05"/></pattern>
    <radialGradient id="v3" cx="50%" cy="40%" r="65%"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="640" height="400" fill="#0a0a0a"/><rect width="640" height="400" fill="url(#g3)"/><rect width="640" height="400" fill="url(#v3)"/>
  <!-- staircase of 5 maturity levels -->
  <g stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5">
    <rect x="92" y="96" width="456" height="208" rx="8" fill="none"/>
  </g>
  <g>
    <rect x="110" y="250" width="78" height="46" rx="6" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.5"/>
    <rect x="198" y="216" width="78" height="80" rx="6" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.55"/>
    <rect x="286" y="180" width="78" height="116" rx="6" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.6"/>
    <rect x="374" y="146" width="78" height="150" rx="6" fill="#ffffff" fill-opacity="0.24" stroke="#ffffff" stroke-opacity="0.7"/>
    <rect x="462" y="112" width="78" height="184" rx="6" fill="#ffffff" fill-opacity="0.30" stroke="#ffffff" stroke-opacity="0.85"/>
  </g>
  <!-- target arrow -->
  <path d="M120 130 H520" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="5 7" fill="none"/>
  <path d="M512 122 l12 8 -12 8" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#ffffff" fill-opacity="0.5" font-family="'JetBrains Mono',monospace" font-size="13" text-anchor="middle">
    <text x="149" y="324">L1</text><text x="237" y="324">L2</text><text x="325" y="324">L3</text><text x="413" y="324">L4</text><text x="501" y="324">L5</text>
  </g>
</svg>
