<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Escalations aggregated across modules with an annual assessment summary">
  <defs><pattern id="rq2" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity="0.05"/></pattern>
  <radialGradient id="rq2v" cx="50%" cy="40%" r="66%"><stop offset="0%" stop-color="#fff" stop-opacity="0.06"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
  <rect width="640" height="400" fill="#0a0a0a"/><rect width="640" height="400" fill="url(#rq2)"/><rect width="640" height="400" fill="url(#rq2v)"/>
  <text x="60" y="52" font-family="'JetBrains Mono',monospace" font-size="10" fill="#fff" fill-opacity="0.5">ESCALATIONS &amp; ANNUAL ASSESSMENT</text>
  <!-- modules feeding a central escalation queue -->
  <g font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#fff" fill-opacity="0.5">
    <text x="40" y="104">MOD 1</text><text x="40" y="146">MOD 2</text><text x="40" y="188">MOD 3</text><text x="40" y="230">MOD 4</text><text x="40" y="272">MOD 5</text>
  </g>
  <g fill="none" stroke="#fff" stroke-opacity="0.4" stroke-width="2">
    <path d="M104 100 C 180 100, 200 170, 250 184"/>
    <path d="M104 142 C 180 142, 200 175, 250 186"/>
    <path d="M104 188 H250"/>
    <path d="M104 226 C 180 226, 200 200, 250 190"/>
    <path d="M104 268 C 180 268, 200 205, 250 192"/>
  </g>
  <!-- escalation queue -->
  <rect x="250" y="150" width="150" height="76" rx="9" fill="#fff" fill-opacity="0.14" stroke="#fff" stroke-opacity="0.8" stroke-width="2.5"/>
  <text x="325" y="178" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" text-anchor="middle">ESCALATED</text>
  <g stroke="#fff" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round"><path d="M268 196 H382"/><path d="M268 210 H360"/></g>
  <!-- annual assessment gauge -->
  <g transform="translate(500,188)">
    <path d="M-66 0 A 66 66 0 0 1 66 0" fill="none" stroke="#fff" stroke-opacity="0.15" stroke-width="13" stroke-linecap="round"/>
    <path d="M-66 0 A 66 66 0 0 1 40 -52" fill="none" stroke="#fff" stroke-opacity="0.85" stroke-width="13" stroke-linecap="round"/>
    <text y="-8" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.6" text-anchor="middle">ANNUAL</text>
    <text y="8" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.6" text-anchor="middle">ASSESS</text>
  </g>
</svg>
