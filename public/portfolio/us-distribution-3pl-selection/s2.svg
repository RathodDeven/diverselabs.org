<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three-candidate 3PL scorecard with the selected provider highlighted">
  <defs><pattern id="ud2" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity="0.05"/></pattern>
  <radialGradient id="ud2v" cx="50%" cy="38%" r="66%"><stop offset="0%" stop-color="#fff" stop-opacity="0.06"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
  <rect width="640" height="400" fill="#0a0a0a"/><rect width="640" height="400" fill="url(#ud2)"/><rect width="640" height="400" fill="url(#ud2v)"/>
  <!-- 3 candidate columns, middle highlighted (selected) -->
  <rect x="244" y="72" width="150" height="268" rx="10" fill="#fff" fill-opacity="0.10" stroke="#fff" stroke-opacity="0.9" stroke-width="2.5"/>
  <g font-family="'JetBrains Mono',monospace" font-size="10" fill="#fff" fill-opacity="0.5" text-anchor="middle">
    <text x="148" y="64">3PL A</text><text x="319" y="64">3PL B</text><text x="490" y="64">3PL C</text>
  </g>
  <!-- row labels -->
  <g font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#fff" fill-opacity="0.5">
    <text x="20" y="100">COLD CHAIN</text><text x="20" y="138">FOOTPRINT</text><text x="20" y="176">DSCSA</text><text x="20" y="214">RETURNS</text><text x="20" y="252">DATA</text><text x="20" y="290">3-YR TCO</text>
  </g>
  <!-- score bars per row per column (x: A=92,B=262,C=432 ; w120) -->
  <g stroke-linecap="round" stroke-width="7">
    <!-- A (dim) -->
    <g stroke="#fff" stroke-opacity="0.3"><path d="M92 96 H180"/><path d="M92 134 H168"/><path d="M92 172 H200"/><path d="M92 210 H160"/><path d="M92 248 H188"/><path d="M92 286 H150"/></g>
    <!-- B (selected, bright) -->
    <g stroke="#fff" stroke-opacity="0.9"><path d="M262 96 H372"/><path d="M262 134 H360"/><path d="M262 172 H378"/><path d="M262 210 H356"/><path d="M262 248 H374"/><path d="M262 286 H368"/></g>
    <!-- C (dim) -->
    <g stroke="#fff" stroke-opacity="0.3"><path d="M432 96 H520"/><path d="M432 134 H540"/><path d="M432 172 H500"/><path d="M432 210 H536"/><path d="M432 248 H512"/><path d="M432 286 H548"/></g>
  </g>
  <!-- selected check -->
  <circle cx="319" cy="318" r="14" fill="#fff"/>
  <path d="M312 318 l5 5 9 -10" stroke="#0a0a0a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
