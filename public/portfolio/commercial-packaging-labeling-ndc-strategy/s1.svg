<svg viewBox="0 0 640 400" role="img" aria-label="Decision scorecard comparing pack-and-label CMO candidates across price, terms, engagement and bottle-plus-blister capability; one candidate paused, one added late, and one marked as the target." xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono',monospace">
