<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Voice-AI landscape: a sub-segment sizing matrix with base, projected, and CAGR columns, paired with a regional growth-signal table; one sub-segment row emphasized">
  <defs>
    <pattern id="g" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity="0.05"/></pattern>
    <radialGradient id="gv" cx="50%" cy="38%" r="66%"><stop offset="0%" stop-color="#fff" stop-opacity="0.06"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="640" height="400" fill="#0a0a0a"/>
  <rect width="640" height="400" fill="url(#g)"/>
  <rect width="640" height="400" fill="url(#gv)"/>

  <text x="32" y="34" font-family="'JetBrains Mono',monospace" font-size="10" fill="#fff" fill-opacity="0.5">VOICE-AI LANDSCAPE · SIZING &amp; SIGNAL</text>
  <text x="608" y="34" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.32">03 / 03</text>

  
  <rect x="32" y="62" width="360" height="284" rx="8" fill="#fff" fill-opacity="0.018" stroke="#fff" stroke-opacity="0.12"/>
  <text x="44" y="80" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.5">SUB-SEGMENT SIZING</text>

  <text x="44"  y="98" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#fff" fill-opacity="0.45">SEGMENT</text>
  <text x="270" y="98" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#fff" fill-opacity="0.45">BASE</text>
  <text x="330" y="98" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#fff" fill-opacity="0.45">PROJ</text>
  <text x="380" y="98" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#fff" fill-opacity="0.45">CAGR</text>
  <line x1="44" y1="104" x2="380" y2="104" stroke="#fff" stroke-opacity="0.16"/>

  
  <text x="44" y="128" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.55">Voice Segment 1</text>
  <rect x="118" y="121" width="58"  height="8" rx="4" fill="#fff" fill-opacity="0.2"/>
  <rect x="118" y="121" width="92"  height="8" rx="4" fill="#fff" fill-opacity="0.1" stroke="#fff" stroke-opacity="0.18" stroke-dasharray="2 2.5"/>
  <text x="270" y="128" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#fff" fill-opacity="0.5">1.0x</text>
  <text x="330" y="128" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#fff" fill-opacity="0.5">1.6x</text>
  <text x="380" y="128" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#fff" fill-opacity="0.5">~mid</text>

  <rect x="40" y="142" width="346" height="26" rx="5" fill="#fff" fill-opacity="0.07" stroke="#fff" stroke-opacity="0.5"/>
  <text x="44" y="159" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.95">Voice Segment 2</text>
  <rect x="118" y="151" width="74"  height="8" rx="4" fill="#fff" fill-opacity="0.95"/>
  <rect x="118" y="151" width="112" height="8" rx="4" fill="#fff" fill-opacity="0.14" stroke="#fff" stroke-opacity="0.85" stroke-dasharray="2 2.5"/>
  <text x="270" y="159" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#fff" fill-opacity="1">1.3x</text>
  <text x="330" y="159" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#fff" fill-opacity="1">2.4x</text>
  <text x="380" y="159" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#fff" fill-opacity="1">high</text>

  <text x="44" y="190" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.55">Voice Segment 3</text>
  <rect x="118" y="183" width="40"  height="8" rx="4" fill="#fff" fill-opacity="0.2"/>
  <rect x="118" y="183" width="62"  height="8" rx="4" fill="#fff" fill-opacity="0.1" stroke="#fff" stroke-opacity="0.18" stroke-dasharray="2 2.5"/>
  <text x="270" y="190" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#fff" fill-opacity="0.5">0.7x</text>
  <text x="330" y="190" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#fff" fill-opacity="0.5">1.1x</text>
  <text x="380" y="190" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#fff" fill-opacity="0.5">~mid</text>

  <line x1="44" y1="206" x2="380" y2="206" stroke="#fff" stroke-opacity="0.1"/>

  <text x="44" y="228" font-family="'JetBrains Mono',monospace" font-size="8" fill="#fff" fill-opacity="0.45">SCALE</text>
  <rect x="90" y="222" width="22" height="7" rx="3.5" fill="#fff" fill-opacity="0.2"/>
  <text x="118" y="228" font-family="'JetBrains Mono',monospace" font-size="8" fill="#fff" fill-opacity="0.45">base</text>
  <rect x="156" y="222" width="22" height="7" rx="3.5" fill="#fff" fill-opacity="0.08" stroke="#fff" stroke-opacity="0.18" stroke-dasharray="2 2.5"/>
  <text x="184" y="228" font-family="'JetBrains Mono',monospace" font-size="8" fill="#fff" fill-opacity="0.45">projected</text>

  <text x="44" y="256" font-family="'JetBrains Mono',monospace" font-size="8" fill="#fff" fill-opacity="0.42">Bars index relative segment size; values</text>
  <text x="44" y="270" font-family="'JetBrains Mono',monospace" font-size="8" fill="#fff" fill-opacity="0.42">are illustrative ratios over the CAGR window.</text>

  <line x1="118" y1="300" x2="230" y2="300" stroke="#fff" stroke-opacity="0.14"/>
  <line x1="118" y1="297" x2="118" y2="303" stroke="#fff" stroke-opacity="0.14"/>
  <line x1="174" y1="298" x2="174" y2="302" stroke="#fff" stroke-opacity="0.12"/>
  <line x1="230" y1="297" x2="230" y2="303" stroke="#fff" stroke-opacity="0.14"/>
  <text x="118" y="316" font-family="'JetBrains Mono',monospace" font-size="8" fill="#fff" fill-opacity="0.4">0</text>
  <text x="230" y="316" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="8" fill="#fff" fill-opacity="0.4">rel. size →</text>

  <text x="44" y="338" font-family="'JetBrains Mono',monospace" font-size="8" fill="#fff" fill-opacity="0.42">CAGR window: multi-year horizon (illustrative).</text>

  <rect x="408" y="62" width="204" height="284" rx="8" fill="#fff" fill-opacity="0.018" stroke="#fff" stroke-opacity="0.12"/>
  <text x="420" y="80" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.5">REGIONAL SIGNAL</text>

  <text x="420" y="98" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#fff" fill-opacity="0.45">REGION</text>
  <text x="540" y="98" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#fff" fill-opacity="0.45">SIZE</text>
  <text x="600" y="98" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#fff" fill-opacity="0.45">CAGR</text>
  <line x1="420" y1="104" x2="600" y2="104" stroke="#fff" stroke-opacity="0.16"/>

  <text x="420" y="128" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.55">Region A</text>
  <circle cx="544" cy="124.5" r="8" fill="#fff" fill-opacity="0.26"/>
  <text x="600" y="128" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#fff" fill-opacity="0.5">~mid</text>

  <text x="420" y="158" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.55">Region B</text>
  <circle cx="544" cy="154.5" r="11" fill="#fff" fill-opacity="0.22"/>
  <text x="600" y="158" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#fff" fill-opacity="0.5">high</text>

  <text x="420" y="190" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.55">Region C</text>
  <circle cx="544" cy="185.5" r="6" fill="#fff" fill-opacity="0.3"/>
  <text x="600" y="190" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#fff" fill-opacity="0.5">~low</text>

  <text x="420" y="220" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.55">Region D</text>
  <circle cx="544" cy="215.5" r="9" fill="#fff" fill-opacity="0.24"/>
  <text x="600" y="220" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#fff" fill-opacity="0.5">~mid</text>

  <line x1="420" y1="238" x2="600" y2="238" stroke="#fff" stroke-opacity="0.1"/>

  <text x="420" y="262" font-family="'JetBrains Mono',monospace" font-size="8" fill="#fff" fill-opacity="0.45">SIZE = bubble area</text>
  <circle cx="430" cy="284" r="5"  fill="#fff" fill-opacity="0.26"/>
  <circle cx="452" cy="284" r="9"  fill="#fff" fill-opacity="0.2"/>
  <text x="470" y="287" font-family="'JetBrains Mono',monospace" font-size="8" fill="#fff" fill-opacity="0.42">small → large</text>

  <text x="420" y="320" font-family="'JetBrains Mono',monospace" font-size="8" fill="#fff" fill-opacity="0.42">CAGR bands are</text>
  <text x="420" y="334" font-family="'JetBrains Mono',monospace" font-size="8" fill="#fff" fill-opacity="0.42">qualitative, illustrative.</text>

  <text x="32" y="372" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.45">Voice-AI landscape: sub-segment sizing matrix plus a regional growth-signal table.</text>
</svg>
