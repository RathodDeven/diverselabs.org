<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Inventory pillar: depot and site stock with lot expiry">
  <defs><pattern id="cl2" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity="0.05"/></pattern>
  <radialGradient id="cl2v" cx="50%" cy="40%" r="66%"><stop offset="0%" stop-color="#fff" stop-opacity="0.06"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
  <rect width="640" height="400" fill="#0a0a0a"/><rect width="640" height="400" fill="url(#cl2)"/><rect width="640" height="400" fill="url(#cl2v)"/>
  <text x="40" y="64" font-family="'JetBrains Mono',monospace" font-size="11" fill="#fff" fill-opacity="0.6">INVENTORY</text>
  <path d="M96 280 H560 M96 280 V96" stroke="#fff" stroke-opacity="0.45" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- stacked depot/site stock bars -->
  <g>
    <g fill="#fff" fill-opacity="0.32"><rect x="124" y="180" width="34" height="100" rx="3"/><rect x="196" y="160" width="34" height="120" rx="3"/><rect x="268" y="200" width="34" height="80" rx="3"/><rect x="340" y="150" width="34" height="130" rx="3"/><rect x="412" y="186" width="34" height="94" rx="3"/><rect x="484" y="172" width="34" height="108" rx="3"/></g>
    <g fill="#fff" fill-opacity="0.6"><rect x="124" y="150" width="34" height="30" rx="3"/><rect x="196" y="132" width="34" height="28" rx="3"/><rect x="268" y="176" width="34" height="24" rx="3"/><rect x="340" y="120" width="34" height="30" rx="3"/><rect x="412" y="160" width="34" height="26" rx="3"/><rect x="484" y="146" width="34" height="26" rx="3"/></g>
  </g>
  <!-- lot/expiry timeline ticks -->
  <g font-family="'JetBrains Mono',monospace" font-size="8" fill="#fff" fill-opacity="0.4" text-anchor="middle">
    <text x="141" y="300">D</text><text x="213" y="300">S</text><text x="285" y="300">D</text><text x="357" y="300">S</text><text x="429" y="300">D</text><text x="501" y="300">S</text>
  </g>
  <g font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.5">
    <rect x="124" y="320" width="12" height="10" rx="2" fill="#fff" fill-opacity="0.6"/><text x="142" y="329">expiring lot</text>
    <rect x="240" y="320" width="12" height="10" rx="2" fill="#fff" fill-opacity="0.32"/><text x="258" y="329">on hand</text>
  </g>
  <text x="556" y="120" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.5" text-anchor="end">depot · site</text>
</svg>
