<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Resupply pillar: months-on-hand gauge and re-supply timing">
  <defs><pattern id="cl3" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity="0.05"/></pattern>
  <radialGradient id="cl3v" cx="50%" cy="40%" r="66%"><stop offset="0%" stop-color="#fff" stop-opacity="0.06"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
  <rect width="640" height="400" fill="#0a0a0a"/><rect width="640" height="400" fill="url(#cl3)"/><rect width="640" height="400" fill="url(#cl3v)"/>
  <text x="40" y="64" font-family="'JetBrains Mono',monospace" font-size="11" fill="#fff" fill-opacity="0.6">RESUPPLY</text>
  <!-- months-on-hand gauge -->
  <g transform="translate(200,230)">
    <path d="M-90 0 A 90 90 0 0 1 90 0" fill="none" stroke="#fff" stroke-opacity="0.15" stroke-width="14" stroke-linecap="round"/>
    <path d="M-90 0 A 90 90 0 0 1 58 -68" fill="none" stroke="#fff" stroke-opacity="0.9" stroke-width="14" stroke-linecap="round"/>
    <text y="-12" font-family="'Space Grotesk',sans-serif" font-size="30" fill="#fff" text-anchor="middle">4.2</text>
    <text y="12" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.5" text-anchor="middle">MONTHS ON HAND</text>
  </g>
  <!-- re-supply timing bars -->
  <text x="380" y="120" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.5">RE-SUPPLY TIMING</text>
  <g>
    <g font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#fff" fill-opacity="0.5">
      <text x="372" y="156">SITE A</text><text x="372" y="186">SITE B</text><text x="372" y="216">SITE C</text><text x="372" y="246">DEPOT</text>
    </g>
    <g><rect x="436" y="146" width="150" height="14" rx="3" fill="#fff" fill-opacity="0.12"/><rect x="436" y="146" width="110" height="14" rx="3" fill="#fff" fill-opacity="0.7"/>
       <rect x="436" y="176" width="150" height="14" rx="3" fill="#fff" fill-opacity="0.12"/><rect x="436" y="176" width="70" height="14" rx="3" fill="#fff" fill-opacity="0.7"/>
       <rect x="436" y="206" width="150" height="14" rx="3" fill="#fff" fill-opacity="0.12"/><rect x="436" y="206" width="134" height="14" rx="3" fill="#fff" fill-opacity="0.7"/>
       <rect x="436" y="236" width="150" height="14" rx="3" fill="#fff" fill-opacity="0.12"/><rect x="436" y="236" width="92" height="14" rx="3" fill="#fff" fill-opacity="0.7"/></g>
  </g>
  <!-- demand signal trigger -->
  <g transform="translate(506,176)"><circle r="9" fill="#fff"/><path d="M-3 -1 l2 3 4 -5" stroke="#0a0a0a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="436" y="296" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#fff" fill-opacity="0.45">○ re-supply triggered on demand signal</text>
</svg>
